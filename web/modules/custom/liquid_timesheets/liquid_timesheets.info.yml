name: 'Liquid Timesheets'
type: module
description: 'Timesheet tracking for LiquidCMS clients (replaces the Open Atrium timesheet tool).'
package: Custom
core_version_requirement: ^11
configure: liquid_timesheets.settings
dependencies:
  - drupal:datetime
  - drupal:node
  - drupal:options
  - drupal:taxonomy
  - drupal:text
  - drupal:user
  - drupal:views
  - views_data_export:views_data_export
